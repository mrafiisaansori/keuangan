<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk — Catatan Keuangan</title>
<style>
  :root{
    --page:      oklch(0.17 0.006 255);
    --surface:   oklch(0.22 0.008 255);
    --surface-2: oklch(0.27 0.010 255);
    --ink:       oklch(0.96 0.004 255);
    --ink-2:     oklch(0.80 0.008 255);
    --muted:     oklch(0.64 0.012 255);
    --hairline:  oklch(0.28 0.010 255);
    --border:    oklch(0.96 0.004 255 / 0.10);

    --accent:    oklch(0.68 0.13 255);

    --blue:      oklch(0.72 0.11 255);
    --orange:    oklch(0.72 0.11 40);
    --aqua:      oklch(0.72 0.11 165);
    --yellow:    oklch(0.72 0.11 90);
    --magenta:   oklch(0.72 0.11 330);
    --green:     oklch(0.72 0.11 145);
    --violet:    oklch(0.72 0.11 300);
    --red:       oklch(0.72 0.11 20);

    --good:      oklch(0.70 0.14 152);
    --warning:   oklch(0.78 0.15 85);
    --serious:   oklch(0.70 0.17 45);
    --critical:  oklch(0.64 0.19 25);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    background:
      radial-gradient(circle at 20% 10%, oklch(0.68 0.13 255 / 0.16), transparent 45%),
      radial-gradient(circle at 85% 25%, oklch(0.72 0.11 300 / 0.16), transparent 45%),
      var(--page);
    color:var(--ink);
    padding:20px;
  }
  .card{
    width:100%;max-width:360px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:28px 24px;
    box-shadow:0 8px 30px rgba(0,0,0,0.5);
  }
  h1{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;margin:0 0 4px;color:var(--accent);}
  p.sub{font-size:12px;color:var(--muted);margin:0 0 22px;}
  label{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:6px;}
  .field{margin-bottom:14px;}
  input{
    width:100%;min-height:44px;padding:11px 12px;border-radius:12px;
    border:1px solid var(--border);background:oklch(0.96 0.004 255 / 0.04);
    color:var(--ink);font-size:15px;outline:none;
  }
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px oklch(0.68 0.13 255 / 0.2);}
  button{
    width:100%;min-height:44px;margin-top:6px;border:0;padding:13px;border-radius:12px;
    font-size:14px;font-weight:700;letter-spacing:.3px;
    background:var(--accent);color:oklch(0.17 0.006 255);
  }
  button:disabled{opacity:.6;}
  .err{
    display:none;margin-top:14px;padding:10px 12px;border-radius:10px;
    background:oklch(0.64 0.19 25 / 0.14);border:1px solid oklch(0.64 0.19 25 / 0.4);
    color:oklch(0.82 0.10 25);font-size:13px;
  }
  .err.show{display:block;}
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1><span style="width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block"></span>Catatan Keuangan</h1>
    <p class="sub">Masuk untuk melihat dan mencatat transaksi.</p>
    <div class="field">
      <label>Username</label>
      <input id="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label>Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit">Masuk</button>
    <div class="err" id="err"></div>
  </form>

<script>
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    const err = document.getElementById('err');
    err.classList.remove('show');
    btn.disabled = true; btn.textContent = 'Memeriksa...';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Gagal masuk');
      window.location.href = '/';
    } catch (ex) {
      err.textContent = ex.message;
      err.classList.add('show');
      btn.disabled = false; btn.textContent = 'Masuk';
    }
  });
</script>
</body>
</html>
