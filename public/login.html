<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk — Catatan Keuangan</title>
<script>try{var t=localStorage.getItem('kg-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --page:      oklch(0.93 0.003 255);
    --surface:   oklch(0.99 0 0);
    --surface-2: oklch(0.955 0.004 255);
    --ink:       oklch(0.22 0.01 255);
    --ink-2:     oklch(0.45 0.01 255);
    --muted:     oklch(0.55 0.01 255);
    --hairline:  oklch(0.91 0.004 255);
    --border:    oklch(0.4 0.03 255 / 0.08);
    --dot-grid:  oklch(0.86 0.006 255);
    --input-bg:  oklch(0.97 0.002 255);

    --accent:    oklch(0.52 0.14 235);
    --violet:    oklch(0.55 0.12 300);
    --critical:  oklch(0.62 0.19 25);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --page:      oklch(0.17 0.006 255);
      --surface:   oklch(0.22 0.008 255);
      --surface-2: oklch(0.27 0.010 255);
      --ink:       oklch(0.96 0.004 255);
      --ink-2:     oklch(0.80 0.008 255);
      --muted:     oklch(0.64 0.012 255);
      --hairline:  oklch(0.28 0.010 255);
      --border:    oklch(0.96 0.004 255 / 0.10);
      --dot-grid:  oklch(0.30 0.010 255);
      --input-bg:  oklch(0.26 0.010 255);
      --accent:    oklch(0.68 0.13 255);
      --violet:    oklch(0.72 0.11 300);
      --critical:  oklch(0.64 0.19 25);
    }
  }
  :root[data-theme="dark"]{
    --page:      oklch(0.17 0.006 255);
    --surface:   oklch(0.22 0.008 255);
    --surface-2: oklch(0.27 0.010 255);
    --ink:       oklch(0.96 0.004 255);
    --ink-2:     oklch(0.80 0.008 255);
    --muted:     oklch(0.64 0.012 255);
    --hairline:  oklch(0.28 0.010 255);
    --border:    oklch(0.96 0.004 255 / 0.10);
    --dot-grid:  oklch(0.30 0.010 255);
    --input-bg:  oklch(0.26 0.010 255);
    --accent:    oklch(0.68 0.13 255);
    --violet:    oklch(0.72 0.11 300);
    --critical:  oklch(0.64 0.19 25);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:'Inter',-apple-system,system-ui,sans-serif;
    background-color:var(--page);
    background-image:radial-gradient(var(--dot-grid) 1.4px, transparent 1.4px);
    background-size:20px 20px;
    color:var(--ink);
    padding:20px;
  }

  .theme-toggle{
    position:fixed;top:16px;right:16px;z-index:5;
    width:40px;height:40px;border-radius:50%;border:1px solid var(--border);
    background:var(--surface);color:var(--ink-2);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px oklch(0.4 0.03 255 / 0.1);cursor:pointer;
  }

  .card{
    width:100%;max-width:360px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:28px 24px;
    box-shadow:0 12px 40px oklch(0.4 0.03 255 / 0.1);
  }
  .illustration{display:flex;justify-content:center;margin-bottom:8px;}
  h1{display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Plus Jakarta Sans',sans-serif;font-size:19px;font-weight:800;margin:0 0 4px;color:var(--ink);text-align:center;}
  p.sub{font-size:12.5px;color:var(--muted);margin:0 0 24px;text-align:center;}
  label{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:6px;}
  .field{margin-bottom:14px;}
  .field-wrap{position:relative;}
  input{
    width:100%;min-height:44px;padding:11px 12px;border-radius:12px;
    border:1px solid var(--hairline);background:var(--input-bg);
    color:var(--ink);font-size:15px;outline:none;
  }
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px oklch(0.52 0.14 235 / 0.18);}
  #password{padding-right:44px;}
  .toggle-pw{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);
    width:36px;height:36px;border-radius:9px;border:0;background:none;
    display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;
  }
  button[type="submit"]{
    width:100%;min-height:44px;margin-top:6px;border:0;padding:13px;border-radius:12px;
    font-size:14px;font-weight:700;letter-spacing:.3px;
    background:var(--accent);color:#fff;
  }
  button[type="submit"]:disabled{opacity:.6;}
  .err{
    display:none;margin-top:14px;padding:10px 12px;border-radius:10px;
    background:oklch(0.62 0.19 25 / 0.1);border:1px solid oklch(0.62 0.19 25 / 0.3);
    color:var(--critical);font-size:13px;
  }
  .err.show{display:block;}
</style>
</head>
<body>
  <button class="theme-toggle" id="btnTheme" title="Ganti tema">
    <svg width="18" height="18" id="themeIconSun" viewBox="0 0 20 20">
      <circle cx="10" cy="10" r="4" fill="currentColor"/>
      <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <line x1="10" y1="1.2" x2="10" y2="3.4"/><line x1="10" y1="16.6" x2="10" y2="18.8"/>
        <line x1="1.2" y1="10" x2="3.4" y2="10"/><line x1="16.6" y1="10" x2="18.8" y2="10"/>
        <line x1="4.2" y1="4.2" x2="5.7" y2="5.7"/><line x1="14.3" y1="14.3" x2="15.8" y2="15.8"/>
        <line x1="4.2" y1="15.8" x2="5.7" y2="14.3"/><line x1="14.3" y1="5.7" x2="15.8" y2="4.2"/>
      </g>
    </svg>
    <svg width="18" height="18" id="themeIconMoon" viewBox="0 0 20 20" style="display:none">
      <path d="M17 12.8A7.2 7.2 0 1 1 7.2 3a5.8 5.8 0 0 0 9.8 9.8Z" fill="currentColor"/>
    </svg>
  </button>

  <form class="card" id="loginForm">
    <div class="illustration">
      <svg width="86" height="72" viewBox="0 0 160 120">
        <ellipse cx="72" cy="132" rx="6" ry="9" fill="oklch(0.40 0.10 230)"/>
        <ellipse cx="102" cy="132" rx="6" ry="9" fill="oklch(0.40 0.10 230)"/>
        <path d="M18 78c0-30 24-46 54-46s54 16 54 46c0 22-16 34-30 38l2 14H46l2-14C34 112 18 100 18 78Z" fill="var(--accent)"/>
        <ellipse cx="118" cy="70" rx="16" ry="12" fill="var(--violet)"/>
        <circle cx="126" cy="66" r="2.6" fill="oklch(0.30 0.02 235)"/>
        <path d="M52 40c-6-10-2-22 8-24 4 8 2 18-8 24Z" fill="var(--violet)"/>
        <rect x="66" y="34" width="18" height="5" rx="2.5" fill="var(--accent)" transform="rotate(-8 75 36)"/>
        <circle cx="86" cy="6" r="15" fill="oklch(0.78 0.15 85)"/>
        <circle cx="86" cy="6" r="15" fill="none" stroke="oklch(0.65 0.15 85)" stroke-width="2"/>
        <text x="86" y="11" font-size="13" font-weight="800" fill="oklch(0.45 0.10 85)" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif">Rp</text>
        <circle cx="30" cy="26" r="4" fill="oklch(0.88 0.10 85 / 0.7)"/>
        <circle cx="140" cy="34" r="3" fill="white" opacity="0.5"/>
      </svg>
    </div>
    <h1>Catatan Keuangan</h1>
    <p class="sub">Masuk untuk melihat dan mencatat transaksi.</p>
    <div class="field">
      <label>Username</label>
      <input id="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="field-wrap">
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="button" class="toggle-pw" id="btnTogglePw" title="Lihat password">
          <svg width="18" height="18" id="pwIconEye" viewBox="0 0 20 20" fill="none">
            <path d="M1 10s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <svg width="18" height="18" id="pwIconEyeOff" viewBox="0 0 20 20" fill="none" style="display:none">
            <path d="M1 10s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
            <line x1="2" y1="18" x2="18" y2="2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
    <button type="submit">Masuk</button>
    <div class="err" id="err"></div>
  </form>

<script>
  function effectiveTheme(){
    return document.documentElement.getAttribute('data-theme')
      || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }
  function syncThemeIcon(){
    const dark = effectiveTheme() === 'dark';
    document.getElementById('themeIconSun').style.display = dark ? 'none' : '';
    document.getElementById('themeIconMoon').style.display = dark ? '' : 'none';
  }
  document.getElementById('btnTheme').onclick = () => {
    const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
    localStorage.setItem('kg-theme', next);
    document.documentElement.setAttribute('data-theme', next);
    syncThemeIcon();
  };
  syncThemeIcon();

  document.getElementById('btnTogglePw').onclick = () => {
    const input = document.getElementById('password');
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    document.getElementById('pwIconEye').style.display = show ? 'none' : '';
    document.getElementById('pwIconEyeOff').style.display = show ? '' : 'none';
  };

  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    const err = document.getElementById('err');
    err.classList.remove('show');
    btn.disabled = true; btn.textContent = 'Memeriksa...';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Gagal masuk');
      window.location.href = '/';
    } catch (ex) {
      err.textContent = ex.message;
      err.classList.add('show');
      btn.disabled = false; btn.textContent = 'Masuk';
    }
  });
</script>
</body>
</html>
